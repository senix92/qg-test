name: Fehler / technische Schuld
description: Reproduzierbar erfassen
body:
  - type: textarea
    id: repro
    attributes: { label: Reproduktion, description: Schritte }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: Erwartetes Verhalten }
    validations: { required: true }
  - type: textarea
    id: impact
    attributes: { label: Auswirkung }
    validations: { required: true }
  - type: dropdown
    id: priority
    attributes: { label: Priorität, options: [P0, P1, P2, P3] }
    validations: { required: true }
  - type: textarea
    id: accept
    attributes: { label: Akzeptanzkriterien }
    validations: { required: true }
